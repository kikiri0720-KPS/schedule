<style>

</style>
</head>
<body>

  <div class="note"><select id="me" style="display:none"></select>달력에서 시작일→종료일을 차례로 누르면 기간 선택 · 일정은 서버에 저장되어 이 주소를 아는 모두가 같이 보고 고칠 수 있어요.</div>
</div>
<div id="toast"></div>

      var all=[],from=0;for(;;){var q=await SB.from("sch_events").select("id,data").range(from,from+999);if(q.error)throw q.error;all=all.concat(q.data);if(q.data.length<1000)break;from+=1000}
      events=all.map(normEv);evSig=sig;chg=true}
    if(await pullLists())chg=true;
    if(chg&&!document.querySelector(".mask")){refreshWho();render()}else if(chg){refreshWho()}
    $("status").textContent="실시간 공유 중 · 누구든 추가/수정하면 모두에게 반영돼요";
  }catch(e){console.error(e);$("status").textContent="서버 연결이 끊겼어요 · 다시 시도 중 ("+errMsg(e)+")"}
  finally{pulling=false}}
(async function(){
  var cached=[];try{cached=JSON.parse(localStorage.getItem("sch_events")||"[]")}catch(x){cached=[]}
  function goLocal(msg){local=true;events=cached;
    if(!LS.mig){events.forEach(function(e){evLines(e).forEach(function(l){if(LS.lines.indexOf(l)<0)LS.lines.push(l)})});LS.mig=1;try{localStorage.setItem("sch_lists",JSON.stringify(LS))}catch(x){}}
    $("status").textContent=msg;refreshWho();render()}
  if(!SB)return goLocal("서버 연결 도구를 불러오지 못해 이 기기에만 저장돼요 (인터넷 확인 후 새로고침)");
  try{
    var t=await SB.from("sch_events").select("id").limit(1);if(t.error)throw t.error;
  }catch(e){
    var m=errMsg(e);console.error(e);
    return goLocal(/sch_events|relation|schema cache|PGRST205|42P01/i.test(m)?"서버 준비 안 됨 · Supabase에서 SQL을 먼저 실행하세요 (지금은 이 기기에만 저장)":"서버 연결 실패 · 이 기기에만 저장돼요 ("+m+")");
  }
  local=false;
  // 이 기기에만 있던 목록·일정을 처음 한 번 서버로 올림 (같은 일정은 건너뜀)
  var mine={lines:LS.lines.slice(),vehicles:LS.vehicles.slice(),people:LS.people.slice()};
  await pullAll(true);
  var migrated=false;try{migrated=localStorage.getItem("sch_cloud_mig")==="1"}catch(x){}
  if(!migrated){
    var addL=0;["lines","vehicles","people"].forEach(function(k){mine[k].forEach(function(v){if(LS[k].indexOf(v)<0){LS[k].push(v);addL++}})});
    if(addL||!listStamp)saveLists();
    var keyOf=function(e){return JSON.stringify([e.date,e.endDate||e.date,e.items||[],e.lines||[]])};
    var have={};events.forEach(function(e){have[e.id]=1;have[keyOf(e)]=1});
    var up=cached.filter(function(e){return e&&typeof e.date==="string"&&!have[e.id]&&!have[keyOf(e)]}).map(function(e){var o=Object.assign({},e);if(!o.id)o.id=newId();return o});
    try{await upsertEvents(up);try{localStorage.setItem("sch_cloud_mig","1")}catch(x){}if(up.length){toast("이 기기 일정 "+up.length+"건을 공유 일정표에 올렸어요");await pullAll(true)}}
    catch(e){toast("이 기기 일정 올리기 실패: "+errMsg(e))}
  }
  refreshWho();render();
  setInterval(function(){if(document.visibilityState==="visible")pullAll()},12000);
  document.addEventListener("visibilitychange",function(){if(document.visibilityState==="visible")pullAll()});
  window.addEventListener("online",function(){pullAll(true)});
})();
})();
</script>
