<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>일정관리표</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="일정관리">
<meta name="theme-color" content="#2f6fed">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1d2330;--sub:#6b7280;--bd:#e3e6ec;--pri:#2f6fed;--ok:#1f9d55;--ing:#d97706;--plan:#2f6fed;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171c;--card:#1d2128;--tx:#e8eaee;--sub:#9aa3b2;--bd:#2d333d;--pri:#6b9bff}}
:root[data-theme="dark"]{--bg:#14171c;--card:#1d2128;--tx:#e8eaee;--sub:#9aa3b2;--bd:#2d333d;--pri:#6b9bff}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 -apple-system,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:12px}
h1{font-size:18px;margin:4px 0 2px}.sub{color:var(--sub);font-size:12px}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0}
button,select,input,textarea{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:8px 10px}
button{cursor:pointer}button.pri{background:var(--pri);border-color:var(--pri);color:#fff}
button.on{border-color:var(--pri);color:var(--pri);font-weight:600}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:10px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.dow{text-align:center;font-size:12px;color:var(--sub);padding:4px 0}
.day{min-height:62px;border:1px solid var(--bd);border-radius:8px;padding:2px;overflow:hidden;cursor:pointer;background:var(--bg)}
.day.out{opacity:.4}.day.today{border-color:var(--pri)}.day.sel{background:var(--pri);border-color:var(--pri)}.day.sel .n{color:#fff}
.day .n{font-size:11px;color:var(--sub)}
.chip{display:block;font-size:10px;line-height:1.3;border-radius:4px;padding:1px 3px;margin-top:1px;color:#fff;word-break:break-all;overflow:hidden}
.s-예정{background:var(--ing)}.s-확정{background:var(--plan)}.s-취소{background:#9ca3af}.s-일정변경{background:#7c3aed}.chip.s-취소{text-decoration:line-through}
.item{display:flex;gap:10px;padding:10px 4px;border-bottom:1px solid var(--bd);cursor:pointer}
.item:last-child{border:0}.item .d{min-width:84px;font-size:12px;color:var(--sub)}
.badge{font-size:11px;border-radius:999px;padding:1px 8px;color:#fff;margin-left:6px}
.mask{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:5}
.modal{background:var(--card);width:100%;max-width:520px;border-radius:16px 16px 0 0;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));max-height:90vh;overflow:auto}
.modal label{display:block;font-size:12px;color:var(--sub);margin:8px 0 3px}
.modal input,.modal select,.modal textarea{width:100%}
.row{display:flex;gap:8px}.row>*{flex:1}
.opts{display:flex;flex-wrap:wrap;gap:6px}.opt{border:1px solid var(--bd);border-radius:999px;padding:5px 11px;font-size:13px;cursor:pointer;user-select:none}.opt.on{background:var(--pri);border-color:var(--pri);color:#fff}
.note{font-size:12px;color:var(--sub);margin:8px 2px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#222;color:#fff;padding:8px 14px;border-radius:10px;font-size:13px;display:none;z-index:9}
</style>
</head>
<body>
<div class="wrap">
  <h1>📅 일정관리표 <span class="sub">개인용</span></h1>
  <div class="sub" id="status">연결 중…</div>
  <div class="bar">
    <button id="vCal" class="on">달력</button><button id="vList">목록</button>
    <select id="fWho" style="display:none"><option value="">지점 전체</option></select>
    <select id="fSt" style="display:none"><option value="">상태 전체</option><option>예정</option><option>확정</option><option>취소</option><option>일정변경</option></select>
    <select id="fKind" style="display:none"><option value="">종류 전체</option><option>휴전작업</option><option>출장</option><option>일반작업</option><option>점검</option><option>기타</option></select>
    <button id="opt" style="margin-left:auto">⚙ 옵션</button>
    <button class="pri" id="add">＋ 일정</button>
  </div>
  <div class="bar" id="tabs" style="overflow-x:auto;flex-wrap:nowrap;margin:0 0 8px"></div>
  <div class="bar" id="nav" style="justify-content:center;margin:0 0 8px">
    <button id="prev">◀</button><b id="ym" style="min-width:110px;text-align:center"></b><button id="next">▶</button><button id="todayBtn">오늘</button>
  </div>
  <div class="card" id="main"></div>
  <div class="bar" style="justify-content:center"><button id="bk">💾 백업 / 복원</button></div>
  <div class="note"><select id="me" style="display:none"></select>달력에서 시작일→종료일을 차례로 누르면 기간 선택 · 이 기기에만 저장돼요.</div>
</div>
<div id="toast"></div>
<script>
(function(){
var $=function(i){return document.getElementById(i)};

function saveLocal(){try{localStorage.setItem("sch_events",JSON.stringify(events))}catch(x){toast("저장 공간 오류")}}

var WK=["정밀점검","드론기별","정기순시","수목정비","열화상","이도진단","변위진단","항공장애등점검","야간하공등동작점검","기별점검","드론기별점검","고배율카메라점검"];

var LS={lines:[],vehicles:[],people:[]};

try{if(!localStorage.getItem("sch_lists"))LS.people=DEFP.slice()}catch(x){}
try{void 0}catch(x){}
function saveLists(){try{localStorage.setItem("sch_lists",JSON.stringify(LS))}catch(x){}}
function evLines(e){if(e.items&&e.items.length)return e.items.map(function(i){return i.line}).filter(Boolean);return e.lines||(e.place?[e.place]:[])}

function asText(e){var a=e.assign||{},p=[];Object.keys(a).forEach(function(w){var x=a[w]||{},v=Array.isArray(x.v)?x.v:(x.v?[x.v]:[]);var pe=Array.isArray(x.pp)?x.pp:[];var t=[pe.join(","),x.p||"",v.join(",")].filter(Boolean).join(" / ");if(t)p.push(w+"("+t+")")});return p.join("; ")}
function ds(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function toast(m){var t=$("toast");t.textContent=m;t.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(function(){t.style.display="none"},2500)}
function el(tag,cls,txt){var e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}
function getMe(){try{return localStorage.getItem("sch_me")||""}catch(e){return ""}}
(function(){var s=$("me");s.appendChild(new Option("선택 안 함",""));BR.forEach(function(n){s.appendChild(new Option(n,n))});s.value=BR.indexOf(getMe())>=0?getMe():""})();
$("me").onchange=function(){try{localStorage.setItem("sch_me",$("me").value)}catch(e){}};

function filtered(){
  var w=$("fWho").value,s=$("fSt").value,k=$("fKind").value;
  return events.filter(function(e){return (!w||e.branch===w)&&(!s||e.status===s)&&(!k||e.kind===k)}).sort(function(a,b){return (a.date+(a.start||"")).localeCompare(b.date+(b.start||""))});
}
function refreshWho(){
  var sel=$("fWho"),v=sel.value,set={};BR.forEach(function(n){set[n]=1});
  events.forEach(function(e){if(e.branch)set[e.branch]=1});
  sel.textContent="";sel.appendChild(new Option("지점 전체",""));
  BR.concat(Object.keys(set).filter(function(n){return BR.indexOf(n)<0}).sort()).forEach(function(n){sel.appendChild(new Option(n,n))});
  sel.value=set[v]?v:"";
}
function drawTabs(){$("fWho").value="";$("tabs").style.display="none";return;var t=$("tabs"),sel=$("fWho");t.textContent="";Array.prototype.forEach.call(sel.options,function(o){var b=el("button",sel.value===o.value?"on":"",o.value?o.value.replace("지점",""):"전체");b.style.cssText="flex:none;white-space:nowrap";b.onclick=function(){sel.value=o.value;try{localStorage.setItem("sch_br",o.value)}catch(x){}render()};t.appendChild(b)})}
function render(){
  drawTabs();var m=$("main");m.textContent="";
  $("nav").style.display=view==="cal"?"flex":"none";
  var list=filtered();
  if(view==="cal"){
    $("ym").textContent=cur.getFullYear()+"년 "+(cur.getMonth()+1)+"월";
    var g=el("div","grid");
    DOW.forEach(function(d){g.appendChild(el("div","dow",d))});
    var first=new Date(cur.getFullYear(),cur.getMonth(),1),start=new Date(first);start.setDate(1-first.getDay());
    var today=ds(new Date());
    for(var i=0;i<42;i++){
      var d=new Date(start);d.setDate(start.getDate()+i);var k=ds(d);
      var c=el("div","day"+(d.getMonth()!==cur.getMonth()?" out":"")+(k===today?" today":"")+(pend&&k===pend?" sel":""));
      c.appendChild(el("div","n",""+d.getDate()));
      list.filter(function(e){return e.date<=k&&k<=(e.endDate||e.date)}).slice(0,3).forEach(function(e){
        var ch=el("span","chip s-"+e.status,(e.branch?"["+e.branch.replace("지점","")+"] ":"")+(e.status==="예정"?"예정 ":e.status==="취소"?"취소 ":e.status==="일정변경"?"변경 ":"")+(e.kind==="휴전작업"?"⚡":"")+(e.need?"👥"+(e.roster?e.roster.length:0)+"/"+e.need+" ":"")+(e.start?e.start+" ":"")+((e.items&&e.items.length?e.items.map(itemText).join(" / "):[evLines(e).join("·"),wk(e)||e.title].filter(Boolean).join(" · "))||"일정"));
        ch.onclick=function(ev){ev.stopPropagation();openDay(e.date,[e],true)};c.appendChild(ch);
      });
      c.onclick=(function(k){return function(){if(!pend){var dayEv=list.filter(function(e){return e.date<=k&&k<=(e.endDate||e.date)});if(dayEv.length){openDay(k,dayEv);return}pend=k;toast("종료일을 눌러 주세요 (하루짜리는 같은 날을 한 번 더)");render();return}var a=pend<k?pend:k,b=pend<k?k:pend;pend=null;render();openForm(null,a,b)}})(k);
      g.appendChild(c);
    }

    if(!list.length){m.appendChild(el("div","sub","등록된 일정이 없어요. ＋ 일정을 눌러 추가해 보세요."));return}
    list.forEach(function(e){
      var it=el("div","item");
      var dt=new Date(e.date+"T00:00:00");
      it.appendChild(el("div","d",(dt.getMonth()+1)+"/"+dt.getDate()+(e.endDate&&e.endDate>e.date?" ~ "+Number(e.endDate.slice(5,7))+"/"+Number(e.endDate.slice(8)):" ("+DOW[dt.getDay()]+")")+(e.start?"\n"+e.start+(e.end?"~"+e.end:""):"")));
      it.firstChild.style.whiteSpace="pre-line";
      var b=el("div");var t=el("div","",e.title||(e.items&&e.items.length?e.items.map(itemText).join(" / "):"")||wk(e)||e.place||"일정");t.style.fontWeight="600";

  }
}
function openDay(k,evs,single){
  var mask=el("div","mask"),f=el("div","modal");mask.appendChild(f);
  var dt=new Date(k+"T00:00:00");
  f.appendChild(el("b","",single?"일정 상세":(dt.getMonth()+1)+"월 "+dt.getDate()+"일 ("+DOW[dt.getDay()]+") 일정"));
  evs.forEach(function(e){var r=el("div","card");r.style.margin="8px 0";
    var top=el("div","row");top.style.alignItems="center";
    var t=el("div","",(e.title||(e.items&&e.items.length?e.items.map(itemText).join(" / "):"")||wk(e)||e.place||"일정"));t.style.cssText="font-weight:600;flex:3";
    var bd=el("span","badge s-"+e.status,e.status);bd.style.flex="none";
    var eb=el("button","pri","수정");eb.style.flex="none";

    top.appendChild(t);top.appendChild(bd);top.appendChild(eb);r.appendChild(top);
    var det=(e.items&&e.items.length?e.items.map(itemFull).join("\n"):[wk(e),asText(e)].filter(Boolean).join(" · "));
    if(det){var d2=el("div","sub",det);d2.style.whiteSpace="pre-line";d2.style.marginTop="4px";r.appendChild(d2)}
    var rg=e.endDate&&e.endDate>e.date?e.date.slice(5)+" ~ "+e.endDate.slice(5):"";if(rg)r.appendChild(el("div","sub",rg));
    if(e.need||(e.roster&&e.roster.length))r.appendChild(el("div","sub","인원 "+(e.roster?e.roster.length:0)+(e.need?"/"+e.need:"")+"명"+(e.roster&&e.roster.length?" · "+e.roster.join(", "):"")));
    if(e.start)r.appendChild(el("div","sub","시간 "+e.start+(e.end?" ~ "+e.end:"")));
    if(e.status==="일정변경"&&e.prevDate)r.appendChild(el("div","sub","원래 일정 "+e.prevDate.slice(5)+(e.prevEnd&&e.prevEnd!==e.prevDate?" ~ "+e.prevEnd.slice(5):"")));
    if(e.memo)r.appendChild(el("div","sub",e.memo));
    f.appendChild(r)});
  var row=el("div","row");row.style.marginTop="10px";
  var nb=el("button","","＋ 이 날짜로 새 일정"),cl=el("button","pri","닫기");
  nb.onclick=function(){mask.remove();pend=k;toast("종료일을 눌러 주세요 (하루짜리는 같은 날을 한 번 더)");render()};

  mask.onclick=function(ev){if(ev.target===mask)mask.remove()};

function openForm(e,date,date2){
  $("toast").style.display="none";
  var mask=el("div","mask"),f=el("div","modal");mask.appendChild(f);
  function field(label,node){var l=el("label","",label);f.appendChild(l);f.appendChild(node);return node}
  f.appendChild(el("b","",e?"일정 수정":"새 일정"));
  var TT=["정밀점검","드론기별","정기순시","수목정비"];
  function mk(opts,cur,blank){var s=el("select");s.appendChild(new Option(blank,""));opts.forEach(function(x){s.appendChild(new Option(x,x))});if(cur&&opts.indexOf(cur)<0)s.appendChild(new Option(cur,cur));s.value=cur||"";return s}
  var dr=el("div","row");var d=el("input");d.type="date";d.value=e?e.date:(date||ds(new Date()));var d2=el("input");d2.type="date";d2.value=e?(e.endDate||e.date):(date2||d.value);
  var v1=el("div"),v2=el("div");v1.appendChild(el("label","","시작일"));v1.appendChild(d);v2.appendChild(el("label","","종료일"));v2.appendChild(d2);dr.appendChild(v1);dr.appendChild(v2);f.appendChild(dr);
  d.onchange=function(){if(d2.value<d.value)d2.value=d.value};
  var r=el("div","row");var s=el("input");s.type="time";s.value=e&&e.start||"";var en=el("input");en.type="time";en.value=e&&e.end||"";
  var w1=el("div"),w2=el("div");w1.appendChild(el("label","","시작"));w1.appendChild(s);w2.appendChild(el("label","","종료"));w2.appendChild(en);r.appendChild(w1);r.appendChild(w2);f.appendChild(r);
  function chips(opts,sel,cb2){var box=el("div","opts");function draw(){box.textContent="";opts.forEach(function(o){var c=el("div","opt"+(sel.indexOf(o)>=0?" on":""),o);c.onclick=function(){var i=sel.indexOf(o);if(i>=0)sel.splice(i,1);else sel.push(o);draw();if(cb2)cb2()};box.appendChild(c)})}draw();return box}
  function picker(opts,sel,ph,redraw){var box=el("div");var s2=el("select");s2.appendChild(new Option(ph,""));opts.forEach(function(o){if(sel.indexOf(o)<0)s2.appendChild(new Option(o,o))});s2.onchange=function(){if(s2.value&&sel.indexOf(s2.value)<0)sel.push(s2.value);redraw()};box.appendChild(s2);var tg=el("div","opts");tg.style.marginTop="6px";sel.forEach(function(o){var c=el("div","opt on",o+" ✕");c.onclick=function(){sel.splice(sel.indexOf(o),1);redraw()};tg.appendChild(c)});box.appendChild(tg);return box}
  function checkList(opts,sel){var box=el("div");box.style.cssText="display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:4px 8px;margin:4px 0";opts.forEach(function(o){var l=el("label");l.style.cssText="display:flex;gap:6px;align-items:center;margin:0;font-size:14px;color:var(--tx)";var c=el("input");c.type="checkbox";c.style.width="auto";c.checked=sel.indexOf(o)>=0;c.onchange=function(){var i=sel.indexOf(o);if(c.checked&&i<0)sel.push(o);if(!c.checked&&i>=0)sel.splice(i,1)};l.appendChild(c);l.appendChild(document.createTextNode(o));box.appendChild(l)});return box}
  function addRow(ph,onAdd){var r=el("div","row");r.style.marginTop="6px";var inp=el("input");inp.placeholder=ph;var b=el("button","","추가");b.style.flex="none";b.onclick=function(){var v=inp.value.trim();if(v){onAdd(v);inp.value=""}};r.appendChild(inp);r.appendChild(b);return r}
  function itemsInit(){if(!e)return [];var its;if(e.items&&e.items.length)its=JSON.parse(JSON.stringify(e.items));else{var L=evLines(e),W=evWorks(e);if(!L.length&&!W.length)return [];var base=L.length?L:[""];its=base.map(function(l){return {line:l,works:W.slice(),sub:(e.sub||[]).slice(),assign:JSON.parse(JSON.stringify(e.assign||{}))}})}
