</head>

var XJ=null;

  XJ=new Promise(function(res,rej){var s=document.createElement("script");s.src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";s.onload=res;s.onerror=function(){XJ=null;rej(new Error("load"))};document.head.appendChild(s)});return XJ}
async function onWeekExcel(file,wbIn){if(!file&&!wbIn)return;

  var best=null;

    (ws["!merges"]||[]).forEach(function(m){var v=ws[XLSX.utils.encode_cell(m.s)];if(!v)return;for(var r=m.s.r;r<=m.e.r;r++)for(var c=m.s.c;c<=m.e.c;c++){var a=XLSX.utils.encode_cell({r:r,c:c});if(!ws[a]){ws[a]={t:v.t,v:v.v,w:v.w,_m:m.s.r+":"+m.s.c}}else if(r!==m.s.r||c!==m.s.c)ws[a]._m=m.s.r+":"+m.s.c}ws[XLSX.utils.encode_cell(m.s)]._m=m.s.r+":"+m.s.c});

    var H=A[hr].map(String),cA=H.findIndex(function(x){return /선로명/.test(x)}),cB=H.findIndex(function(x){return /업무/.test(x)}),cC=H.findIndex(function(x){return /구간/.test(x)});
    var cW=-1,cDays={};for(var r=Math.max(0,hr-3);r<=hr;r++){A[r].forEach(function(x,ci){if(/작업자/.test(String(x)))cW=ci;if(r===hr&&/^\s*\d{1,2}\s*$/.test(String(x))&&ci>cC)cDays[ci]=+x})}
    var txt=A.slice(0,hr+1).map(function(r){return r.join(" ")}).join(" ").replace(/\s/g,"");
    var pm=txt.match(/(20\d\d)[.\-\/](\d{1,2})[.\-\/](\d{1,2})~(?:(20\d\d)[.\-\/])?(\d{1,2})[.\-\/](\d{1,2})/);
    var rows=[];
    for(var r2=hr+1;r2<A.length;r2++){var R=A[r2],ln=String(R[cA]||"").trim(),wk_=cB>=0?String(R[cB]||"").trim():"";
      if(/※/.test(ln+wk_)||(!ln&&/※/.test(R.join(""))))break;if(!ln&&!wk_)continue;
      var wc=cW>=0?ws[XLSX.utils.encode_cell({r:r2+RG.s.r,c:cW+RG.s.c})]:null,wt=cW>=0?String(R[cW]||""):"";
      var days=[];Object.keys(cDays).forEach(function(ci){var v=String(R[ci]||"").trim();if(v&&v!=="0")days.push(cDays[ci])});
      rows.push({line:ln.replace(/\s*\n\s*/g," "),work:wk_.replace(/\s*\n\s*/g," "),note:cC>=0?String(R[cC]||"").replace(/\s*\n\s*/g," ").trim():"",workers:wt.split(/\n/).map(function(s){return s.trim()}).filter(Boolean),days:days.sort(function(a,b){return a-b}),wkey:wc&&wc._m?wc._m:""})}

  if(!best||!best.rows.length){toast("주간공정표 양식(선로명·업무명·작업자 칸)을 찾지 못했어요");return}
  var mask=el("div","mask"),f=el("div","modal");mask.appendChild(f);document.body.appendChild(mask);
  showWeekPreview(mask,f,best)}
